<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>MR Live2D Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        #app { position: relative; width: 100vw; height: 100vh; }

        #controls {
            position: absolute;
            z-index: 20;
            top: 12px;
            right: 72px; /* avoid overlap with menu toggle */
            width: 240px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.62);
            color: #e6e6e6;
            font: 13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            pointer-events: auto;
            transition: transform 220ms ease, opacity 220ms ease;
            will-change: transform;
        }

        #controls.collapsed { transform: translateX(110%); opacity: 0.0; pointer-events: none; }

        #controls label { display: block; margin: 6px 0 4px; font-size: 12px; }
        #controls select, #controls input[type="range"], #controls input[type="checkbox"] { font-size: 12px; }
        #controls select { max-width: 100%; box-sizing: border-box; text-overflow: ellipsis; }
        #controls .motion-row { display: flex; align-items: center; gap: 6px; }
        #controls .motion-row select { flex: 0 1 auto; min-width: 0; }
        #controls .motion-row #replayBtn { flex-shrink: 0; margin-left: 0 !important; }
        #controls button { font-size: 12px; line-height: 1.2; padding: 3px 8px; }

        canvas { display: block; width: 100%; height: 100%; }

        /* Connecting / preloader UI */
        .connecting { cursor: progress !important; }
        /* No CSS canvas dimming here — dimming is handled in Pixi to avoid affecting background gradient */
        #loading { display: none; position: absolute; width: 334px; height: 54px; background: url('assets/connecting.png') right bottom no-repeat; z-index: 40; pointer-events: none; }
        /* Adjust to a centered 4:3 viewport frame for landscape */
        .connecting #loading { display: block; }
        /* Position relative to a centered 4:3 frame (landscape). Use safe-area inset for mobile and align to frame right edge */
        #loading { right: calc((100vw - min(100vw, calc(100vh * 4 / 3))) / 2 + env(safe-area-inset-right, 0px)); bottom: 20px; }
        /* On narrow screens keep a small inset so the badge is visible and not clipped */
        @media (max-width:520px) {
            #loading { right: calc((100vw - min(100vw, calc(100vh * 4 / 3))) / 2 + env(safe-area-inset-right, 12px)); bottom: 14px; width: 260px; height: 44px; background-size: contain; }
        }
        /* Ensure portrait devices that report odd viewport dimensions still align */
        @media (orientation: portrait) {
            #loading { right: calc((100vw - min(100vw, calc(100vh * 4 / 3))) / 2 + env(safe-area-inset-right, 0px)); }
        }

        .menu-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 30;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            color: #e6e6e6;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .small { font-size: 12px; line-height: 1.2; padding: 3px 8px; }

        #controls .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px 8px;
            margin-top: 8px;
        }
        #controls .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
            cursor: pointer;
            line-height: 1.15;
        }
        #controls .checkbox-grid input[type="checkbox"] {
            margin: 0;
            flex-shrink: 0;
        }

        /* Background Selector Modal (matches #controls minimal dark overlay style) */
        #bgSelectorModal[hidden] { display: none; }
        #bgSelectorModal {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-sizing: border-box;
            font: 13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: #e6e6e6;
        }
        .bg-modal-dialog {
            width: min(860px, 100%);
            max-height: min(85vh, 720px);
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
        }
        .bg-modal-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        #bgModalCloseBtn {
            background: none;
            border: none;
            color: #e6e6e6;
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
            cursor: pointer;
        }
        .bg-modal-toolbar {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        #bgSearchInput {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            padding: 4px 6px;
        }
        #bgCategorySelect {
            font-size: 12px;
            padding: 4px;
        }
        .bg-modal-hr {
            margin: 8px 0;
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .bg-modal-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 2px;
        }
        #bgModalStatus[hidden] { display: none; }
        #bgModalStatus {
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #bbb;
        }
        .bg-section[hidden] { display: none; }
        .bg-section + .bg-section { margin-top: 12px; }
        .bg-section-title {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 600;
            color: #ccc;
        }
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(122px, 1fr));
            gap: 8px;
        }
        .bg-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            border-radius: 4px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.06);
            color: #e6e6e6;
            font: inherit;
            font-size: 11.5px;
            text-align: left;
            cursor: pointer;
        }
        .bg-card:hover { background: rgba(255, 255, 255, 0.12); }
        .bg-card.is-selected {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.18);
        }
        .bg-thumb {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 3px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.06);
            display: block;
        }
        .bg-swatch, .bg-thumb-img, .bg-thumb-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .bg-thumb-img { object-fit: cover; }
        .bg-thumb-img:not([src]) { visibility: hidden; }
        .bg-card-label {
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }
        .bg-more-btn[hidden] { display: none; }
        .bg-more-btn { margin-top: 8px; }
        .bg-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        @media (max-width: 520px) {
            #controls { width: 180px; padding: 8px; right: 8px; top: 8px; border-radius: 8px; }
            .menu-toggle { width: 34px; height: 34px; right: 8px; top: 8px; }
            #controls label { font-size: 11px; }
            #controls .checkbox-grid { gap: 5px 6px; }
            #controls .checkbox-grid label { font-size: 10.5px; gap: 4px; }
            #controls select, #controls input[type="range"] { font-size: 11px; }
            #controls button { font-size: 11px; line-height: 1.2; padding: 2px 6px; }
            #bgSelectorModal { padding: 8px; }
            .bg-modal-dialog { max-height: 90vh; }
            .bg-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
        }

    </style>

    <script src="lib/live2dcubismcore.min.js"></script>
    <script src="lib/live2d.min.js"></script>
    <script src="lib/pixi.min.js"></script>
    <script src="lib/pixi-live2d-display-index.min.js"></script>
    <script src="magica/js/viewer/pixi-patches.js"></script>
</head>
<body>
    <div id="app">
        <canvas id="canvas"></canvas>
        <button id="menuToggle" class="menu-toggle" aria-expanded="true" aria-label="Toggle controls">✕</button>
        <div id="loading" aria-hidden="true"></div>

        <div id="controls">
            <div style="display:flex;align-items:center;gap:8px;margin-right:8px;">
                <button id="captureBtn" class="small" type="button">Capture</button>
                <button id="randomBtn" class="small" type="button">Random</button>
                <div style="flex:1"></div>
            </div>

            <label for="characterSelect">Character</label>
            <select id="characterSelect"></select>

            <label for="outfitSelect">Outfit</label>
            <select id="outfitSelect"></select>

            <!-- Target selector: only shown in dual unit mode -->
            <div id="dualTargetRow" style="display:none;margin-top:6px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                    <div style="font-size:12px;">Target</div>
                    <button id="swapBtn" type="button" class="small" style="padding:2px 8px;font-size:11px;">⇄ Swap</button>
                </div>
                <div style="display:flex;gap:8px;font-size:11px;">
                    <label><input type="radio" name="dualTarget" id="targetUnit1" value="primary" checked> Unit 1</label>
                    <label><input type="radio" name="dualTarget" id="targetUnit2" value="secondary"> Unit 2</label>
                    <label><input type="radio" name="dualTarget" id="targetBoth" value="both"> Both</label>
                </div>
            </div>

            <label for="motionSelect">Motion</label>
            <div class="motion-row">
                <select id="motionSelect"></select>
            </div>

            <label for="expressionSelect">Face</label>
            <select id="expressionSelect"></select>

            <!-- Assets base UI removed from controls (kept programmatically accessible via query param / localStorage / window.MR_ASSETS_*) -->

            <hr style="margin:10px 0;border:0;border-top:1px solid rgba(255,255,255,0.06);">

            <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
                <div style="margin-right:auto">Cheek</div>
                <div style="display:flex;gap:6px;">
                    <label><input type="radio" name="cheek" id="cheek0" value="-1" checked>-1</label>
                    <label><input type="radio" name="cheek" id="cheek0" value="0" checked>0</label>
                    <label><input type="radio" name="cheek" id="cheek1" value="1">1</label>
                    <label><input type="radio" name="cheek" id="cheek2" value="2">2</label>
                </div>
            </div>

            <div class="checkbox-grid">
                <label><input id="eyeClose" type="checkbox">Eye Close</label>
                <label><input id="mouthOpen" type="checkbox">Mouth Open</label>
                <label><input id="tear" type="checkbox">Tear</label>
                <label><input id="soulGem" type="checkbox">Soul Gem</label>
            </div>

            <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
                <button id="micToggle" type="button" style="flex-shrink:0;white-space:nowrap;">Start Mic Lipsync</button>
                <input id="micSensitivity" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="Mic Sensitivity" title="Mic Sensitivity" style="flex:1;min-width:0;margin:0;">
            </div>

            <hr style="margin:8px 0;border:0;border-top:1px solid rgba(255,255,255,0.06);">

            <div>
                <button id="changeBgBtn" type="button" style="width:100%;">Change Background</button>
            </div>
        </div>

        <div id="bgSelectorModal" hidden role="dialog" aria-modal="true" aria-labelledby="bgModalTitle">
            <div class="bg-modal-dialog">
                <div class="bg-modal-top">
                    <span id="bgModalTitle">Background</span>
                    <button id="bgModalCloseBtn" type="button" aria-label="Close">✕</button>
                </div>
                <div class="bg-modal-toolbar">
                    <input id="bgSearchInput" type="search" placeholder="Search..." aria-label="Search backgrounds">
                    <select id="bgCategorySelect" aria-label="Filter category">
                        <option value="all">All</option>
                        <option value="solid">Solid</option>
                        <option value="story">Story</option>
                        <option value="home">Home</option>
                    </select>
                </div>
                <hr class="bg-modal-hr">
                <div id="bgModalBody" class="bg-modal-body">
                    <div id="bgModalStatus" hidden></div>
                    <section id="bgSectionSolid" class="bg-section">
                        <div class="bg-section-title">Solid</div>
                        <div id="bgGridSolid" class="bg-grid"></div>
                    </section>
                    <section id="bgSectionStory" class="bg-section">
                        <div class="bg-section-title">Story</div>
                        <div id="bgGridStory" class="bg-grid"></div>
                        <button id="bgMoreStory" type="button" class="bg-more-btn small" data-section-key="story" hidden>More...</button>
                    </section>
                    <section id="bgSectionHome" class="bg-section">
                        <div class="bg-section-title">Home</div>
                        <div id="bgGridHome" class="bg-grid"></div>
                        <button id="bgMoreHome" type="button" class="bg-more-btn small" data-section-key="home" hidden>More...</button>
                    </section>
                </div>
                <hr class="bg-modal-hr">
                <div class="bg-modal-footer">
                    <button id="bgCancelBtn" type="button" class="small">Cancel</button>
                    <button id="bgOkBtn" type="button" class="small">OK</button>
                </div>
            </div>
        </div>


    </div>

    <script src="magica/js/viewer/viewer.js"></script>
    <script src="magica/js/viewer/live2d.js"></script>
    <script type="module" src="magica/js/viewer/main.js"></script>
</body>
</html>
